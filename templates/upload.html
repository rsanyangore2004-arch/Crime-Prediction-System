{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2 class="mb-4">Upload Dataset</h2>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <input type="file" name="file" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">
            Upload
        </button>

    </form>

    {% if preview %}
    <div class="mt-4">
        <h4>Preview</h4>
        {{ preview | safe }}
    </div>
    {% endif %}

</div>

{% endblock %}
